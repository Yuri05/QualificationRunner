name: Install PK-Sim Portable
description: >
  Downloads and installs the latest PK-Sim Portable build from the
  Open-Systems-Pharmacology/PK-Sim nightly workflow and sets the
  PKSIM_INSTALLATION_FOLDER environment variable for subsequent steps.

inputs:
  github-token:
    description: GitHub token used to authenticate API requests (for higher rate limits)
    required: true
  pksim-workflow:
    description: Workflow filename in the PK-Sim repository
    required: true
  pksim-branch:
    description: Branch in the PK-Sim repository to resolve artifacts from
    required: true

runs:
  using: composite
  steps:
    - name: Download and install PK-Sim Portable
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PKSIM_WORKFLOW: ${{ inputs.pksim-workflow }}
        PKSIM_BRANCH: ${{ inputs.pksim-branch }}
      run: |
        $installDir = Join-Path $PWD "PK-Sim"
        New-Item -ItemType Directory -Force -Path $installDir | Out-Null

        # Get the latest successful run of the PK-Sim nightly workflow
        $headers = @{
          "User-Agent"    = "QualificationRunner-CI"
          "Accept"        = "application/vnd.github+json"
          "Authorization" = "Bearer $env:GH_TOKEN"
        }
        $runsUrl = "https://api.github.com/repos/Open-Systems-Pharmacology/PK-Sim/actions/workflows/$env:PKSIM_WORKFLOW/runs?status=success&per_page=1&branch=$env:PKSIM_BRANCH"
        $runsResponse = Invoke-RestMethod -Uri $runsUrl -Headers $headers
        if ($runsResponse.workflow_runs.Count -eq 0) {
          Write-Error "No successful PK-Sim nightly workflow runs found"
          exit 1
        }
        $runId = $runsResponse.workflow_runs[0].id
        Write-Host "Latest successful PK-Sim run ID: $runId"

        # Find the PKSim Portable artifact from that run
        $artifactsUrl = "https://api.github.com/repos/Open-Systems-Pharmacology/PK-Sim/actions/runs/$runId/artifacts"
        $artifactsResponse = Invoke-RestMethod -Uri $artifactsUrl -Headers $headers
        $artifact = $artifactsResponse.artifacts | Where-Object { $_.name -like "PKSim Portable *" } | Select-Object -First 1
        if ($null -eq $artifact) {
          Write-Error "PKSim Portable artifact not found in run $runId"
          exit 1
        }
        Write-Host "Found artifact: $($artifact.name)"

        # Download via nightly.link (provides unauthenticated access to public GitHub Actions artifacts)
        $encodedName = [Uri]::EscapeDataString($artifact.name)
        $nightlyLinkUrl = "https://nightly.link/Open-Systems-Pharmacology/PK-Sim/workflows/$env:PKSIM_WORKFLOW/$env:PKSIM_BRANCH/$encodedName.zip"
        Write-Host "Downloading from: $nightlyLinkUrl"

        $zipPath = Join-Path $env:RUNNER_TEMP "PKSim-Portable.zip"
        Invoke-WebRequest -Uri $nightlyLinkUrl -OutFile $zipPath

        Expand-Archive -Path $zipPath -DestinationPath $installDir -Force

        "PKSIM_INSTALLATION_FOLDER=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append
